<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>GX Notepad</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="container">

			<div id="listNoteBox"></div>

			<div class="bot_box">
				<textarea id="note" placeholder="Write here..."></textarea>
				<div class="btn_panel">
					<button id="btnAddNewNote">
						<img src="./icons/add.svg" alt="add">
					</button>
					<button id="btnDelNewNote">
						<img src="./icons/delete.svg" alt="del">
					</button>
				</div>
			</div>

		</div>
		<script src="popup.js"></script>
	</body>
</html>
